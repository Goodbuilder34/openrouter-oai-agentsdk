[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openrouter-oai-agentsdk"
version = "0.1.1"
description = "Plug OpenRouter into the OpenAI Agents SDK with a drop-in model provider and RunConfig."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["openrouter", "openai", "agents", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "openai>=1.40.0",
    "openai-agents>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "ruff>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/Goodbuilder34/openrouter-oai-agentsdk"
Repository = "https://github.com/Goodbuilder34/openrouter-oai-agentsdk"
Issues = "https://github.com/Goodbuilder34/openrouter-oai-agentsdk/issues"
Changelog = "https://github.com/Goodbuilder34/openrouter-oai-agentsdk/releases"

[project.scripts]
openrouter-agentsdk-check = "openrouter_oai_agentsdk.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["openrouter_provider"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["openrouter_oai_agentsdk*"]

[tool.setuptools.package-data]
openrouter_oai_agentsdk = ["py.typed"]
